<div class="page-transition" [class.active]="isTransitioning()">
  <span class="page-transition__text">{{ transitionText() }}</span>
</div>

<header class="site-header">
  <div class="site-header__inner">
    <a routerLink="/" class="logo">Aleksa Obradovic<span>.</span></a>
    <nav class="main-nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
        >Home</a
      >
      <a routerLink="/education" routerLinkActive="active">Education</a>
      <a routerLink="/licenses" routerLinkActive="active">Licenses</a>
      <a routerLink="/projects" routerLinkActive="active">Projects</a>
      <a routerLink="/contact" routerLinkActive="active">Contact</a>
    </nav>
  </div>
</header>

<main>
  <router-outlet />
</main>

<footer class="site-footer">
  <div class="site-footer__inner">
    <p>© 2026 Aleksa Obradovic. Built with Angular & Node.js.</p>
    <div class="site-footer__links">
      <a routerLink="/contact">Contact</a>
    </div>
  </div>
</footer>
