<section class="admin-about">
  <h2>Manage About Section</h2>

  @if (isLoading()) {
    <p>Loading...</p>
  } @else {
    <form [formGroup]="aboutForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input id="fullName" type="text" formControlName="fullName" />
      </div>

      <div class="form-group">
        <label for="title">Title</label>
        <input id="title" type="text" formControlName="title" />
      </div>

      <div class="form-group">
        <label for="bio">Bio</label>
        <textarea id="bio" rows="5" formControlName="bio"></textarea>
      </div>

      <div class="form-group">
        <label for="photoUrl">Photo URL (optional)</label>
        <input id="photoUrl" type="text" formControlName="photoUrl" />
      </div>

      <div class="form-group">
        <label for="email">Email (optional)</label>
        <input id="email" type="email" formControlName="email" />
      </div>

      <div class="form-group">
        <label for="phone">Phone (optional)</label>
        <input id="phone" type="text" formControlName="phone" />
      </div>

      <div class="form-group">
        <label for="location">Location (optional)</label>
        <input id="location" type="text" formControlName="location" />
      </div>

      @if (successMessage()) {
        <div class="success-banner">{{ successMessage() }}</div>
      }
      @if (errorMessage()) {
        <div class="error-banner">{{ errorMessage() }}</div>
      }

      <button type="submit" [disabled]="aboutForm.invalid">Save</button>
    </form>
  }
</section>
